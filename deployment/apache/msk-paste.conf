# ============================================================================
# MSK Paste – Apache2 Reverse-Proxy Configuration (Reference)
#
# This file is a reference / template. The actual active configuration is
# generated by install.sh under /etc/apache2/sites-available/msk-paste.conf
# (with the user-supplied domain).
#
# After enabling SSL via `sudo certbot --apache` the file is extended with
# the HTTPS vhost and an HTTP→HTTPS redirect.
# ============================================================================

<VirtualHost *:80>
    ServerName {{DOMAIN}}
    ServerAdmin webmaster@{{DOMAIN}}

    # ─── Reverse proxy to Next.js (port 3012) ──────────────────────
    ProxyPreserveHost   On
    ProxyRequests       Off
    ProxyTimeout        60

    ProxyPass        / http://127.0.0.1:3012/
    ProxyPassReverse / http://127.0.0.1:3012/

    # ─── Forward client IP & protocol ──────────────────────────────
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Host  "%{HTTP_HOST}e"
    RequestHeader set X-Real-IP         "%{REMOTE_ADDR}s"

    # ─── Gzip ──────────────────────────────────────────────────────
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/css text/javascript
        AddOutputFilterByType DEFLATE application/javascript application/json
        AddOutputFilterByType DEFLATE image/svg+xml
    </IfModule>

    # ─── Logs ──────────────────────────────────────────────────────
    ErrorLog  ${APACHE_LOG_DIR}/msk-paste-error.log
    CustomLog ${APACHE_LOG_DIR}/msk-paste-access.log combined

    LogLevel warn
</VirtualHost>
