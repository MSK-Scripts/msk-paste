name: Dependency Review

# Runs on every Pull Request and scans newly added/updated npm packages
# against the GitHub Advisory Database (known CVEs).
# Fails the PR if a vulnerable or malicious package is introduced.

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents:      read
  pull-requests: write

jobs:
  dependency-review:
    name: Scan dependencies for vulnerabilities
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity:    moderate
          comment-summary-in-pr: always
          # Only licenses this AGPL-3.0 project can take in. A package outside
          # the list fails the review; a reviewed exception goes into
          # allow-dependencies-licenses as its purl.
          allow-licenses: >-
            MIT, ISC, 0BSD, BSD-2-Clause, BSD-3-Clause, Apache-2.0,
            BlueOak-1.0.0, CC0-1.0, CC-BY-4.0, OFL-1.1, MPL-2.0,
            LGPL-3.0-or-later, AGPL-3.0-or-later
